<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./logo.png">
    <title>Sign-Up Form</title>
</head>
<body>

    <div class="leftside">
        <div class="logocontainer">
            <img src="./logo.png" alt="All In Fitness logo">
            <span>All In</span>
        </div>
    </div>
    <div class="rightside">
        <div class="heading">
            <p>All In Fitness is where the strong get stronger — a raw, no-excuses gym for lifters who grind, sweat, and leave everything on the floor. This isn’t a spa; it’s a battlefield for progress.</p>
            <p>Commit now — go all in.</p>
        </div>
        <form action="/example.com/path" method="post">
            <fieldset>
                <p>Let's do this!</p>
                <div class="names">
                    <div class="firstname">
                        <label for="firstname">FIRST NAME</label>
                        <input type="text" id="firstname" name="firstname">
                    </div>
                    <div class="lastname">
                        <label for="lastname">LAST NAME</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>
                </div>
               
                <div class="contact">
                    <div class="email">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email">
                    </div>
                    
                    <div class="phonenumber">
                        <label for="phonenumber">PHONE NUMBER</label>
                        <input type="tel" id="phonenumber" name="phonenumber">
                    </div>
                </div>
                
                <div class="pass">
                    <div class="password">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="confirmpass">
                        <label for="confirmpass">CONFIRM PASSWORD</label>
                        <input type="password" id="confirmpass" name="confirmpass">
                    </div>
                </div>
            </fieldset>
            <div class="bottomform">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="/" noreferrer>Log In</a></p>
            </div>
        </form>
    </div>
</body>
</html>
